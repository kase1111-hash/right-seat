name: Build & Test

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore FlightGuardian.sln

      - name: Build
        run: dotnet build FlightGuardian.sln -c Release --no-restore

      - name: Test
        run: dotnet test FlightGuardian.sln -c Release --no-build --verbosity normal

      - name: Validate detection scenarios
        # Replays every recorded scenario through the detection engine and
        # fails the build on any missed detection or false positive.
        run: dotnet run --project src/Guardian.Replay -c Release --no-build -- training/scenarios

      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detection-scorecard
          path: training/scenarios/scorecard.json
          if-no-files-found: ignore
